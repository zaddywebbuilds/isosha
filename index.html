<!doctype html>
<html lang="en-NG">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#003B17" />

    <title>Isosha Herbal Capsules | Eye Wellness Supplement Nigeria</title>
    <meta
      name="description"
      content="Isosha Herbal Capsules: a daily eye-wellness supplement with turmeric, clove, ginger and black pepper, plus vitamins A and B2, which contribute to normal vision. 30 capsules, from ₦21,500. Delivery across Nigeria."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="keywords" content="eye supplement Nigeria, herbal eye supplement, vitamins for eye health, Isosha, Netwill Herbals, eye care supplement Lagos" />

    <!--
      The canonical URL and every absolute social URL come from `siteUrl`
      in src/config/site.js. Change that one constant when a custom domain
      is connected and these tags, the sitemap and the structured data all
      follow. The absolute URLs below are rewritten at runtime by
      src/hooks/useSeoHead.js.
    -->

    <!-- Open Graph -->
    <link rel="canonical" href="https://zaddywebbuilds.github.io/isosha/" />
    <meta property="og:url" content="https://zaddywebbuilds.github.io/isosha/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Netwill Herbals" />
    <meta property="og:locale" content="en_NG" />
    <meta property="og:title" content="Isosha Herbal Capsules | Eye Wellness Supplement Nigeria" />
    <meta
      property="og:description"
      content="The daily eye-wellness capsule for Nigerian adults over 30. Four botanicals, four vitamins, one capsule a day. 30 capsules per bottle, from ₦21,500 with delivery nationwide."
    />
    <meta property="og:image" content="https://zaddywebbuilds.github.io/isosha/assets/images/isosha-social-card.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:alt" content="A bottle of Isosha Herbal Capsules by Netwill Herbals, 30 capsules per bottle" />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Isosha Herbal Capsules | Eye Wellness Supplement Nigeria" />
    <meta
      name="twitter:description"
      content="The daily eye-wellness capsule for Nigerian adults over 30. Four botanicals, four vitamins, one capsule a day. 30 capsules per bottle, from ₦21,500 with delivery nationwide."
    />
    <meta name="twitter:image" content="https://zaddywebbuilds.github.io/isosha/assets/images/isosha-social-card.jpg" />

    <!-- LCP: the hero bottle. Preloaded at the width phones actually fetch. -->
    <link
      rel="preload"
      as="image"
      href="assets/images/isosha-bottle-display-500.webp"
      imagesrcset="assets/images/isosha-bottle-display-500.webp 500w, assets/images/isosha-bottle-display-900.webp 900w, assets/images/isosha-bottle-display-1200.webp 1200w"
      imagesizes="(min-width: 1024px) 38vw, (min-width: 640px) 60vw, 82vw"
      fetchpriority="high"
    />

    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="favicon.svg" />

    <!--
      Structured data describes only facts that have been confirmed:
      the product name, brand, category and the fact that it comes in
      30-capsule bottles. No aggregateRating, no review and no health claim
      is included, because none has been verified.
      Offers are injected at runtime from src/config/pricing.js so the markup
      can never drift from the prices shown on the page.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
